:root{
--base-color:white;
--base-variant:whitesmoke;
--text-color:#111528;
--secondary-text:#232738;
--primary-color:#3a435d;
--accent-color:#00ffee;
}

.darkmode{
    --base-color:#070b1d;
    --base-variant:#101425;
    --text-color:#fff;
    --primary-color:#3a435d;
    --accent-color:#00ffee;
}


        *{
    margin:0;
    padding:0;
    box-sizing: border-box;
    font-family: 'Noto',sans-serif;
}

body{
    overflow: hidden;
}

header{
    width:100vw;
    height:70px;
    padding:1rem;
    box-shadow: 0 0 10px rgba(128, 128, 128, 0.336);
    display: flex;
    align-items: center;
    background-color: var(--base-color);
    justify-content: space-between;
}

li{
    list-style: none; 
    font-size: 1.2rem;
    color: grey;
    cursor: pointer;
}

main{
    background-color: var(--base-color);
    width:100vw;
    height: calc(100vh - 70px);
    display: flex;
    justify-content: space-between;
}

.head{
    background-image:linear-gradient(60deg,#00fe61,#00ffff);
    background-clip: text;
    color:transparent;
}

.navbar-items{
    width:100%;
    height:100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap:1rem;
}


.navbar{
    width:150px;
    height:400px;
    background-color: rgba(0, 0, 0, 0.267);
    align-self: center;
    margin-left:.5rem;
    border-radius: 30px;
}

section{
    width:calc(100vw - 150px);
    height:100%;
    overflow-y: scroll;
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(100px,300px));
    grid-template-rows: repeat(10,minmax(40vh,60vh));
    gap:1rem;
    grid-auto-flow: row;
    padding: 1rem;
    justify-content:center ;
    background-color: var(--base-color);
}

img{
    object-fit: cover;
    width: 100%;
    height:100%;
    border-radius: 30px;
}

.card{
    background-color: grey;
    border-radius: 30px;
    margin: 1rem;
    cursor: pointer;

}
.card:hover{
    transform: scale(1.1);
}







.install.active{
    width:30vw;
    height:70px;
    background-image:linear-gradient(60deg,#29da6d,#03b1b1);
    cursor: pointer;
    z-index: 1000;
    top:80%;
    color: aliceblue;
    left:50%;
    position: fixed;
    transform: translateX(-50%);
    font-size: 1.2rem;
    border:none;
    border-radius:30px;
}


.card.active{
    margin:0;
    z-index:1000;
    position: fixed;
    top:50%;
    left:50%;
    transform: translate(-50%,-60%);
    width:50%;
    height:70%;
}

.x.active{
    top:10%;
    left:95%;
    position: fixed;
    font-size: 1.2rem;
    cursor: pointer;
    color: whitesmoke;
    z-index: 10000;
}

        background-color: hsla(0, 1%, 13%, 0.336);
        backdrop-filter: blur(5px);
    }
    section{
        width: 100vw;
    }
    main{
        padding: 0;

    .navbar-items{
        width:100%;
        height:100%;
        display: flex;
        align-items: center;
        flex-direction: row;
        justify-content: center;
        gap:1rem;
    }


    .install.active{
        width:70vw;

        background-image:linear-gradient(60deg,#29da6d,#03b1b1);
        cursor: pointer;
        z-index: 1000;
        top:80%;
        color: aliceblue;
        left:50%;
        position: fixed;
        transform: translateX(-50%);
        font-size: 1.2rem;

    .card.active{
        margin:0;

        top:50%;

}



.items{
    font-size: 1.2rem;

}

</head>
<body class="darkmode">
    <button id="theme-switch"><i class="fi fi-rr-background"></i></button>
    <header>

        <h1 class="head">Play Tools</h1>
        <div class="head-item">
            
        <ul>
                <li><i class="fi fi-br-circle-user"></i></li>
            </ul>
            <a class="button" href="M Centers 8th Edition 8.0.1.3 x64 (1).zip" download>Download Zip</a>
          <button class="button"id="installBtn">
                        📥 Download App
                </button>
        </div>
    </header>
    <main>
        <nav class="navbar">
            <ul class="navbar-items">
                <li class="items"><i class="fi fi-br-search"></i></li>
                <li class="items"><i class="fi fi-sr-multiple"></i></li>
                <li class="items"><i class="fi fi-ss-home"></i></li>
                <li class="items"><i class="fi fi-bs-location-arrow"></i></li>
            </ul>
        </nav>
        <section>
            <div class="card card1"><img src="public/cool.webp" alt=""></div>
            <div class="card card2"><img src="public/fortnite.webp" alt=""></div>
            <div class="card card3"><img src="public/cooling.avif" alt=""></div>
            <div class="card card4"><img src="public/roblox.avif" alt=""></div>
            <div class="card card5"><img src="public/pokemon.avif" alt=""></div>
            <div class="card card6"><img src="public/fc.avif" alt=""></div>
            <div class="card card7"><img src="public/nba_.avif" alt=""></div>
            <div class="card card8"><img src="public/carracing.jpg" alt=""></div>
            <div class="card card9"><img src="public/cc.jpg" alt=""></div>
            <div class="card card10"><img src="public/sonic.jpg" alt=""></div>
        </section>

    <div class="cover">

    </div>
   <a href="https://apktoy.com/download/com.mojang.minecraftpe_1.21.111.1_free.html"><button class="install">Install</button></a>
    <i class="fi fi-br-cross x"></i>
<script type="text/javascript">
    // Card interaction logic
    const card = document.querySelectorAll('.card');
    const cover = document.querySelector('.cover');
    const install = document.querySelector('.install')
    const x = document.querySelector('.x');

    card.forEach((card) => {
        card.addEventListener('click', () => {
            cover.classList.add('active');
            card.classList.add('active');
            install.classList.add('active');
            x.classList.add('active');

            x.addEventListener('click', () => {
                cover.classList.remove('active');
                card.classList.remove('active');
                install.classList.remove('active');
                x.classList.remove('active');
            });
        });
    });

    // Dark mode functionality
    document.addEventListener("DOMContentLoaded", function () {
        const darkmode = localStorage.getItem('darkmode');
        const themeSwitch = document.getElementById('theme-switch');

        const enableDarkmode = () => {
            document.body.classList.add('darkmode')
            localStorage.setItem('darkmode', 'active')
        }

        const disableDarkmode = () => {
            document.body.classList.remove('darkmode')
            localStorage.setItem('darkmode', 'inactive')
        }

        if (darkmode === 'active') {
            enableDarkmode();
        } else {
            disableDarkmode();
        }

        themeSwitch.addEventListener('click', () => {
            if (document.body.classList.contains('darkmode')) {
                disableDarkmode();
            } else {
                enableDarkmode();
            }
        });
    });

    // Enhanced PWA Installation Logic
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");

    // Check if app is already installed
    function isPWAInstalled() {
        return window.matchMedia('(display-mode: standalone)').matches || 
               window.navigator.standalone === true;
    }

    // Hide install button permanently
    function hideInstallButton() {
        installBtn.style.display = "none";
        localStorage.setItem('pwaInstalled', 'true');
    }

    // Show install button
    function showInstallButton() {
        installBtn.style.display = "block";
    }

    // Check installation status on page load
    if (isPWAInstalled() || localStorage.getItem('pwaInstalled') === 'true') {
        hideInstallButton();
    } else {
        installBtn.style.display = "none"; // Hide by default, show only when prompt available
    }

    // Listen for beforeinstallprompt event
    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Only show button if not already installed
        if (!isPWAInstalled() && localStorage.getItem('pwaInstalled') !== 'true') {
            showInstallButton();
        }
    });

    // Install button click handler
    installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) {
            console.log("No install prompt available");
            return;
        }

        // Hide button immediately when clicked
        hideInstallButton();
        
        // Show the install prompt
        deferredPrompt.prompt();
        
        // Wait for the user to respond
        const { outcome } = await deferredPrompt.userChoice;
        
        if (outcome === 'accepted') {
            console.log('User accepted the install prompt');
            // Button is already hidden, and localStorage is set
        } else {
            console.log('User dismissed the install prompt');
            // If user dismisses, show button again next time
            localStorage.removeItem('pwaInstalled');
        }
        
        deferredPrompt = null;
    });

    // Listen for app installed event
    window.addEventListener("appinstalled", () => {
        console.log("PWA was installed successfully");
        hideInstallButton();
        deferredPrompt = null;
    });

    // Register Service Worker
    if ("serviceWorker" in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker
                .register("/service-worker.js")
                .then((registration) => {
                    console.log("Service Worker registered ✅ Scope:", registration.scope);
                })
                .catch(err => console.log("SW registration failed:", err));
        });
    }

    // Listen for display mode changes
    window.matchMedia('(display-mode: standalone)').addEventListener('change', (evt) => {
        if (evt.matches) {
            console.log('App is running in standalone mode');
            hideInstallButton();
        }
    });
</script>
